name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Test status-widget script execution
      run: |
        node scripts/status-widget.mjs --out test-status.html --model "Test Model"
        test -f test-status.html
        grep -q "حالة الجلسة" test-status.html

    - name: Test npx execution entrypoints
      run: |
        node bin/status-widget.js --out npx-status.html --model "NPX Test"
        test -f npx-status.html
